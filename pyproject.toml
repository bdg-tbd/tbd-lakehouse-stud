[project]
name = "tbd-lakehouse"
version = "0.1.0"
description = "TBD lakehouse exercise: generators, bridge, ops commands and tests"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cryptography>=50.0.2",
    "faker>=40.44.0",
    "google-cloud-billing>=1.21.0",
    "google-cloud-pubsub>=2.43.0",
    "google-cloud-resource-manager>=1.19.0",
    "google-cloud-storage>=3.17.1",
    "snowflake-connector-python>=3.12",
    "snowpipe-streaming>=1.9",
]

[dependency-groups]
dev = [
    "pandas>=3.1.0",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tbd_lakehouse"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]

# marimo lab (read by `marimo edit` in the lab container): students run cells themselves.
# Nothing runs on open; running a cell or changing a widget only marks downstream cells stale.
[tool.marimo.runtime]
auto_instantiate = false
on_cell_change = "lazy"
